# EMS platform — local development infrastructure.
#
# ALL CREDENTIALS IN THIS FILE AND infra/keycloak/ems-realm.json ARE LOCAL-DEVELOPMENT-ONLY
# PLACEHOLDERS. Never reuse them in any shared, staging, or production environment.
#
#   pnpm infra:up              # core services
#   pnpm infra:up:workflows    # + Temporal (needed from Release 2)
#
name: ems

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_local_dev_only
      POSTGRES_DB: ems_dev
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for documents (used from Release 1).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ems-local-dev
      MINIO_ROOT_PASSWORD: ems-local-dev-only-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # OIDC identity provider with TOTP MFA. Realm, clients, and fictional users are imported on start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-dev-only
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ems
      KC_DB_PASSWORD: ems_local_dev_only
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/ems-realm.json:/opt/keycloak/data/import/ems-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Captures outbound email locally; nothing is ever delivered externally.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  temporal:
    profiles: ["workflows"]
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ems
      POSTGRES_PWD: ems_local_dev_only
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    profiles: ["workflows"]
    image: temporalio/ui:2.39.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    depends_on: [temporal]

volumes:
  postgres-data:
  redis-data:
  minio-data:
